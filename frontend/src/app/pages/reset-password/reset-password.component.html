<section class="auth-layout">
  <aside class="auth-brand">
    <div class="brand-mark">C</div>
    <p class="eyebrow">Clinevo · Smart Inbox</p>
    <h1>Choose a new password.</h1>
    <p class="lede">After you save it, you will be signed in and taken to the reviewer queue.</p>
  </aside>

  <div class="auth-panel">
    <div class="auth-card">
      <p class="eyebrow">Account recovery</p>
      <h2>New password</h2>
      <p class="muted">Need a new link? <a routerLink="/forgot-password">Request another email</a></p>

      @if (error()) {
        <div class="banner error" role="alert">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          New password
          <input type="password" formControlName="password" autocomplete="new-password" placeholder="At least 8 characters" />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <span class="field-error">Use at least 8 characters.</span>
          }
        </label>
        <label>
          Confirm password
          <input type="password" formControlName="confirm" autocomplete="new-password" />
          @if (form.controls.confirm.touched && form.controls.confirm.invalid) {
            <span class="field-error">Confirm your new password.</span>
          }
        </label>
        <button type="submit" class="btn primary" [disabled]="submitting() || !token()">
          {{ submitting() ? 'Saving…' : 'Save password and sign in' }}
        </button>
      </form>
    </div>
  </div>
</section>
