<section class="auth-layout">
  <aside class="auth-brand">
    <div class="brand-mark">C</div>
    <p class="eyebrow">Clinevo · Smart Inbox</p>
    <h1>Create your reviewer account.</h1>
    <p class="lede">
      Join with Google or register with email. You will land in the inbox as soon as the account is
      ready.
    </p>
  </aside>

  <div class="auth-panel">
    <div class="auth-card">
      <p class="eyebrow">Get started</p>
      <h2>Sign up</h2>
      <p class="muted">Already have an account? <a routerLink="/sign-in">Sign in</a></p>

      @if (error()) {
        <div class="banner error" role="alert">{{ error() }}</div>
      }

      <button type="button" class="btn google" (click)="google()">
        <span class="g-mark">G</span>
        Continue with Google
      </button>

      <div class="rule"><span>or sign up with email</span></div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          Full name
          <input type="text" formControlName="name" autocomplete="name" placeholder="Your name" />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <span class="field-error">Enter at least 2 characters.</span>
          }
        </label>
        <label>
          Email
          <input type="email" formControlName="email" autocomplete="email" placeholder="name@company.com" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="field-error">Enter a valid email address.</span>
          }
        </label>
        <label>
          Password
          <input type="password" formControlName="password" autocomplete="new-password" placeholder="At least 8 characters" />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <span class="field-error">Use at least 8 characters.</span>
          }
        </label>
        <button type="submit" class="btn primary" [disabled]="submitting()">
          {{ submitting() ? 'Creating account…' : 'Create account' }}
        </button>
      </form>
    </div>
  </div>
</section>
